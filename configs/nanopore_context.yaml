# Nanopore per-context indel rates derived from DNArSim and DeSP publications.
# Homopolymer penalties follow measurements reported in Wick et al. 2019
# (doi:10.1186/s13059-019-1727-y) and Jain et al. 2018 (doi:10.1038/nbt.4060).
# Tables express elevated error probabilities for long homopolymer tracts that
# are merged with the baseline chemistry rates from ``nanopore.yml``.
minion:
  insertion_profile:
    5: 0.16
  deletion_profile:
    5: 0.22
  context_indels:
    AA:
      1:
        insertions: 0.05
        deletions: 0.08
      5:
        insertions: 0.24
        deletions: 0.26
