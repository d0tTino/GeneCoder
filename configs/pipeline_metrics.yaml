# Sample pipeline configuration demonstrating metric collection.
# Pass --metrics-path to specify the metrics file before running:
#   genecli bundle run configs/pipeline_metrics.yaml --metrics-path metrics.json \
#     --emit-manifest-report
# Inspect the dropout-aware outputs afterwards with commands such as:
#   jq '.metrics.channel.dropout' decoded.txt.json
#   jq '.metrics.oligo_metrics.dropout_flags' decoded.txt.json
#   jq '.metrics.sequence_batch.metadata' decoded.txt.json
encode:
  input_files:
    - tests/data/vertical_slice.txt
  method: base4_direct
  fec: hamming_7_4
simulate:
  simulators:
    - name: indel
      profile: nanopore_adapter  # Delegates to NanoporeChannel (R10.4 preset)
  synthesis:
    gc_min: 0.0
    gc_max: 1.0
    max_homopolymer: 8
  cost_model:
    synthesis:
      usd_per_nt: 0.002
    sequencing:
      usd_per_read: 0.0004
    redundancy:
      baseline_coverage: 4
  pipeline:
    dropout_rate: 0.2
    coverage_distribution:
      0: 0.3
      4: 0.7
    parallel: false
    workers: null
    use_process_pool: false
    use_mpi: false
decode:
  method: base4_direct
