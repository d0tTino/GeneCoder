# Example channel configuration combining sequencing simulators
# with synthesis constraints. The same structure can be saved as JSON.

input: encoded/message.fasta
output: simulated.fasta

synthesis:
  min_length: 25
  max_length: 300
  max_homopolymer: 4
  optimization:
    mode: fixed_checks

simulators:
  - name: illumina
    substitution_rate: 0.001
    insertion_rate: 0.0001
    deletion_rate: 0.0001
    coverage: 1
    read_length: 150

pipeline:
  parallel: false
  workers: null
  use_process_pool: false
  use_mpi: false
