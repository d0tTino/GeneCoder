# Dropout-aware channel pipeline for multi-oligo batches.
input: encoded/multi_oligo_stream.fasta
output: simulated_multi_oligo.fasta

synthesis:
  min_length: 80
  max_length: 220
  max_homopolymer: 5

simulators:
  - name: illumina
    profile: miseq
    coverage: 18
    read_length: 150

pipeline:
  dropout_rate: 0.12
  coverage_distribution:
    12: 0.25
    16: 0.5
    24: 0.25
  parallel: true
  workers: 4
