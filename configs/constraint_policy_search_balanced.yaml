min_length: 80
max_length: 180
gc_min: 0.45
gc_max: 0.55
max_homopolymer: 3
restriction_site_bans:
  - GAATTC
  - AAGCTT
repair:
  enabled: true
  profile: balanced
  strategy: external_solver
  ecc_protected_prefix: 16
optimization:
  mode: policy_search
  search_candidates: 16
  search_mutations: 2
  seed: 7
objectives:
  solver: deterministic
  hard_constraints: [length, gc, homopolymer]
  soft_objectives:
    - key: gc_range_penalty
      weight: 1.5
      goal: min
    - key: homopolymer_cap_penalty
      weight: 1.3
      goal: min
    - key: restriction_site_penalty
      weight: 2.0
      goal: min
    - key: decode_success_proxy
      weight: 1.2
      goal: max
