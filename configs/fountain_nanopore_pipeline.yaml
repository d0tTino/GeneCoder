# Pipeline using GC-balanced encoding with Fountain FEC and the Nanopore
# simulator, keeping GC between 45–55% and homopolymers capped at 3 bp.
encode:
  input_files:
    - examples/pipeline_demo_input.txt
  method: gc_balanced
  fec: fountain
simulate:
  simulators:
    - nanopore
  synthesis:
    gc_min: 0.45
    gc_max: 0.55
    max_homopolymer: 3
    min_length: 25
    max_length: 600
  pipeline:
    nanopore_profile: r10.4
decode:
  method: gc_balanced
