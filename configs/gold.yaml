# Gold-standard pipeline preset using GC-balanced encoding and Reed-Solomon FEC
# with MiSeq-style Illumina simulation and 40–60% GC synthesis constraints.
encode:
  input_files:
    - tests/data/vertical_slice.txt
  method: gc_balanced
  fec: reed_solomon
simulate:
  simulators:
    - name: insilicoseq
      profile: miseq
  synthesis:
    gc_min: 0.4
    gc_max: 0.6
    max_homopolymer: 3
    min_length: 25
    max_length: 300
  pipeline:
    illumina_profile: miseq
    coverage_distribution:
      18: 1.0
decode:
  method: gc_balanced
