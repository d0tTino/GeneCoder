# Pipeline demonstration configuration that performs encoding, simulated sequencing,
# decoding and metrics export. Provide --metrics-path when invoking the bundle command
# to capture metrics:
#   genecli bundle run configs/pipeline_demo.yaml --cache-dir artifacts/runs/pipeline-demo \
#     --metrics-path artifacts/runs/pipeline-demo/metrics.json \
#     --emit-manifest-report
encode:
  input_files:
    - examples/pipeline_demo_input.txt
  method: base4_direct
  fec: hamming_7_4
simulate:
  synthesis:
    gc_min: 0.45
    gc_max: 0.55
    max_homopolymer: 3
    optimization:
      mode: policy_search
      search_candidates: 8
      search_mutations: 1
      seed: 11
  simulators:
    - name: indel
      profile: illumina_adapter  # Delegates to IlluminaChannel (MiSeq V3 preset)
  pipeline:
    parallel: false
    workers: null
    use_process_pool: false
    use_mpi: false
decode:
  method: base4_direct
