repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
        args: ["--config-file", "pyproject.toml", "--show-error-codes"]
        pass_filenames: false
        additional_dependencies: ["cryptography", "types-PyYAML"]
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.13.7
    hooks:
      - id: markdown-link-check
        files: '^(docs/.*\.md|README\.md)$'
        args: ['-c', '.mlc.config.json']
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
      - id: check-glossary-terms
        name: check glossary terms
        entry: python scripts/check_glossary_terms.py
        language: python
        pass_filenames: false
      - id: check-init-export-duplicates
        name: check init export duplicates
        entry: python scripts/check_init_export_duplicates.py
        language: python
        pass_filenames: false
