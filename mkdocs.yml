site_name: GeneCoder Documentation
site_url: https://d0ttino.github.io/GeneCoder/
theme:
  name: material
  palette:
    primary: indigo
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Usage Guide: usage.md
      - Manifest Format: manifest.md
      - Reproducibility Guide: reproducibility.md
  - Project Overview:
      - Vision & Core Concept: vision.md
      - Implemented Features: features.md
      - Technology Stack: technology_stack.md
  - Migration Guide: migration.md
  - Development:
      - Development Roadmap: development_roadmap.md
      - Development Vision: DEVELOPMENT_VISION.md
  - Integrations:
      - n8n Overview: n8n_overview.md
  - Tutorials:
      - CLI Tutorial: cli_tutorial.md
      - GUI Tutorial: gui_tutorial.md
      - Web API Tutorial: web_api_tutorial.md
      - Local Execution Only: cloud.md
      - Helix Frontend: helix_frontend.md
      - Parallel Pipeline: parallel.md
      - MPI Pipeline Execution: mpi.md
  - Archived:
      - Full Development Vision: archived/DEVELOPMENT_VISION.md
  - Technology Stack: technology_stack.md
  - Development Roadmap: development_roadmap.md
  - Development Vision: DEVELOPMENT_VISION.md

  - Plugin System: plugins.md
  - Glossary: glossary.md

  - API Reference: api_reference.md

