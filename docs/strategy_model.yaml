version: 1
metadata:
  canonical_file: docs/strategy_model.yaml
  generated_files:
    - docs/capabilities.yaml
    - docs/product_strategy.md
    - docs/vision.md
    - docs/development_roadmap.md
    - docs/capability_maturity_badges.md
phases:
  - id: 1
    name: Foundation sustainment
    objective: Keep MVP workflows reliable and reproducible.
    execution_focus: Stabilize shipped bundles, manifests, and dashboard compatibility.
  - id: 2
    name: Robust encoding pipeline
    objective: Expand profile/codec breadth while preserving determinism.
    execution_focus: Increase simulator profile coverage without violating runtime budgets.
  - id: 3
    name: Simulation and analysis
    objective: Scale benchmark quality and cross-suite confidence.
    execution_focus: Enforce BER, throughput, and category-level CI guardrails.
  - id: 4
    name: Ecosystem and automation
    objective: Harden plugin governance and operational automation.
    execution_focus: Keep registry publication and execution policy checks continuously green.
feature_capabilities:
  - id: cli_bundle_presets
    name: CLI bundle presets for end-to-end pipelines
    status: implemented
    phase: 1
    owner_modules:
      - src/genecoder/cli/bundle.py
      - src/genecoder/pipeline.py
    validation_artifacts:
      - type: test
        path: tests/test_bundle.py
    completion_criteria:
      - id: bundle_cli_acceptance
        description: Bundle CLI integration and preset validation tests pass.
        artifacts:
          - type: junit_xml
            path: artifacts/acceptance/junit-bundle-cli.xml
            checks:
              - tests.test_bundle::test_bundle_run
              - tests.test_bundle::test_bundle_unknown_section
        pass_threshold: 100% listed JUnit test cases passed
  - id: illumina_simulation_profiles
    name: Illumina simulation with profile-resolved errors
    status: implemented
    phase: 1
    owner_modules:
      - src/genecoder/simulators/illumina/channel.py
      - src/genecoder/simulators/illumina/profiles.py
    validation_artifacts:
      - type: test
        path: tests/test_illumina_coverage_quality.py
    completion_criteria:
      - id: illumina_profile_quality_acceptance
        description: Illumina profile quality and validation checks pass.
        artifacts:
          - type: junit_xml
            path: artifacts/acceptance/junit-illumina-profile.xml
            checks:
              - tests.test_illumina_coverage_quality::test_channel_calibrate_writes_expected_artifacts
        pass_threshold: 100% listed JUnit test cases passed
  - id: nanopore_simulation_profiles
    name: Nanopore simulation with context-aware profile controls
    status: implemented
    phase: 1
    owner_modules:
      - src/genecoder/simulators/nanopore.py
      - src/genecoder/simulators/nanopore_profiles.py
    validation_artifacts:
      - type: test
        path: tests/test_nanopore_context_profile.py
    completion_criteria:
      - id: nanopore_context_acceptance
        description: Nanopore context profile behavior is verified by acceptance tests.
        artifacts:
          - type: junit_xml
            path: artifacts/acceptance/junit-nanopore-context.xml
            checks:
              - tests.test_nanopore_context_profile::test_calibration_threshold_evaluation_flags_violations
              - tests.test_nanopore_context_profile::test_builtin_profile_context_bias
        pass_threshold: 100% listed JUnit test cases passed
  - id: deterministic_reproducibility_governance
    name: Deterministic seed/profile reproducibility governance
    status: implemented
    phase: 2
    owner_modules:
      - src/genecoder/pipeline.py
      - src/genecoder/cli/cli.py
    validation_artifacts:
      - type: acceptance_test
        path: tests/test_acceptance_deterministic_reproducibility_governance.py
    ci_status_checks:
      - capability-deterministic-reproducibility
    completion_criteria:
      - id: deterministic_repro_runtime_report
        description: Two executable pipeline runs are byte-identical and preserve deterministic seed/stage provenance.
        artifacts:
          - type: runtime_report_json
            path: artifacts/acceptance/deterministic-reproducibility-runtime.json
            suite: deterministic_reproducibility_governance
            required_true:
              - evidence.decoded_sha256_equal
              - evidence.seed_provenance_equal
              - evidence.simulate_stage_metrics_equal
        pass_threshold: report.passed is true and all evidence booleans are true
  - id: benchmark_depth_and_parity
    name: Standardized benchmark depth and parity validation
    status: implemented
    phase: 3
    owner_modules:
      - benchmarks/throughput.py
      - benchmarks/error_rate.py
    validation_artifacts:
      - type: acceptance_test
        path: tests/test_acceptance_benchmark_depth_and_parity.py
    ci_status_checks:
      - capability-benchmark-depth-and-parity
    completion_criteria:
      - id: throughput_gate_floor
        description: Executable throughput benchmark gate report proves encode speed, BER parity, runtime, and decode success stay within configured thresholds.
        artifacts:
          - type: benchmark_gate_json
            path: artifacts/acceptance/benchmark-gate-throughput.json
            benchmark: throughput
        pass_threshold: report.passed is true and gate checks are present
      - id: ber_parity_gate
        description: Executable error-rate benchmark gate report proves BER, throughput, runtime, and decode success stay within configured thresholds.
        artifacts:
          - type: benchmark_gate_json
            path: artifacts/acceptance/benchmark-gate-error_rate.json
            benchmark: error_rate
        pass_threshold: report.passed is true and gate checks are present
      - id: benchmark_acceptance_contract
        description: Benchmark acceptance tests assert executable depth/parity behavior and gate-failure reporting.
        artifacts:
          - type: junit_xml
            path: artifacts/acceptance/junit-benchmark-depth-and-parity.xml
            checks:
              - tests.test_acceptance_benchmark_depth_and_parity::test_gate_enforcement
              - tests.test_acceptance_benchmark_depth_and_parity::test_deterministic_benchmark_schema
              - tests.test_acceptance_benchmark_depth_and_parity::test_noisy_scenarios_inject_measurable_noise
        pass_threshold: 100% listed JUnit test cases passed
  - id: plugin_registry_policy_automation
    name: Plugin registry policy/security automation
    status: implemented
    phase: 4
    owner_modules:
      - src/genecoder/plugin_manager.py
      - src/genecoder/plugin_runtime/registry.py
    validation_artifacts:
      - type: acceptance_test
        path: tests/test_acceptance_plugin_registry_policy_automation.py
    ci_status_checks:
      - capability-plugin-registry-policy
    completion_criteria:
      - id: plugin_policy_runtime_report
        description: Executable registry policy report proves unsigned packages hard-fail, signed packages load, and policy/provenance violations are rejected.
        artifacts:
          - type: plugin_policy_report_json
            path: artifacts/acceptance/plugin-registry-policy-runtime.json
            suite: plugin_registry_policy_automation
            required_true:
              - evidence.unsigned_entries_hard_fail
              - evidence.signed_entries_install_and_load
              - evidence.policy_rejection_reason_disallowed_license
              - evidence.policy_rejection_reason_missing_provenance
        pass_threshold: report.passed is true and all policy evidence booleans are true
  - id: cloud_worker_remote_execution
    name: Cloud worker remote execution
    status: deprecated
    phase: 4
    owner_modules:
      - src/genecoder/compat/legacy/cloud/worker.py
kpi_gates:
  - gate: Phase 1 -> Phase 2
    checks:
      - metric: Weekly usage (oligos_per_week)
        threshold: '>= 1,000 simulated oligos/week for 4 consecutive ISO weeks'
        evidence:
          - artifacts/runs/<run-id>/metrics.json
          - artifacts/runs/<run-id>/metrics.kpi.json
          - docs/metrics.md
  - gate: Phase 2 -> Phase 3
    checks:
      - metric: Deterministic reproducibility stability
        threshold: 100% deterministic seed/profile checks for 2 consecutive weeks
        evidence:
          - tests/test_simulator_seed_reproducibility.py
          - tests/test_illumina_coverage_quality.py
          - tests/test_nanopore_context_profile.py
      - metric: Throughput floor
        threshold: '>= 2.0 MB/s Base-4 encode throughput with BER observed at baseline 0.0'
        evidence:
          - benchmarks/throughput.py
          - PYTHONPATH=src python benchmarks/throughput.py
          - docs/performance.md
  - gate: Phase 3 -> Phase 4
    checks:
      - metric: BER baseline quality
        threshold: <= 0.01 BER on baseline profile/seed
        evidence:
          - benchmarks/error_rate.py
          - PYTHONPATH=src python benchmarks/error_rate.py
          - docs/performance.md
      - metric: Suite category health
        threshold: Green CI across CLI/API, pipeline/simulation, and plugins/security suites
        evidence:
          - tests/test_cli*.py
          - tests/test_pipeline*.py
          - tests/test_plugin*.py
  - gate: Phase 4 release gate
    checks:
      - metric: Plugin policy compliance
        threshold: 100% pass on plugin spec/security checks before publication
        evidence:
          - tests/test_plugin_spec_validation.py
          - tests/test_plugin_security.py
          - configs/registry.yaml
deployment_posture:
  cloud_enabled: false
  cloud_worker_enabled: false
  local_execution_only: true
support_policy:
  unsupported_module_prefixes:
    - src/genecoder/cloud/
  deprecated_module_prefixes:
    - src/genecoder/compat/legacy/
strategy_sections:
  product_strategy_current_capabilities:
    include_ids:
      - cli_bundle_presets
      - illumina_simulation_profiles
      - nanopore_simulation_profiles
  product_strategy_priority_gaps:
    include_ids:
      - deterministic_reproducibility_governance
      - benchmark_depth_and_parity
      - plugin_registry_policy_automation
  vision_capability_status:
    include_ids:
      - cli_bundle_presets
      - illumina_simulation_profiles
      - nanopore_simulation_profiles
      - deterministic_reproducibility_governance
      - benchmark_depth_and_parity
      - plugin_registry_policy_automation
phase_gates:
  - gate: Phase 1 -> Phase 2
    canonical_source: docs/strategy_model.yaml
    measurable_checks:
      - metric: Weekly usage (oligos_per_week)
        threshold: '>= 1,000 simulated oligos/week for 4 consecutive ISO weeks'
        tests_or_checks:
          - genecli stats
          - /metrics endpoint export
        docs_links:
          - docs/metrics.md
        evidence_artifacts:
          - artifacts/runs/<run-id>/metrics.json
          - artifacts/runs/<run-id>/metrics.kpi.json
  - gate: Phase 2 -> Phase 3
    canonical_source: docs/strategy_model.yaml
    measurable_checks:
      - metric: Reproducibility pass rate
        threshold: 100% deterministic seed/profile checks for 2 consecutive weeks
        tests_or_checks:
          - pytest -q tests/test_acceptance_deterministic_reproducibility_governance.py
        docs_links:
          - docs/reproducibility.md
        evidence_artifacts:
          - artifacts/acceptance/deterministic-reproducibility-runtime.json
      - metric: Throughput median floor
        threshold: '>= 2.0 MB/s Base-4 encode throughput with BER observed at baseline 0.0'
        tests_or_checks:
          - PYTHONPATH=src python benchmarks/throughput.py
          - pytest -q tests/test_acceptance_benchmark_depth_and_parity.py -k throughput_gate_definition
        docs_links:
          - docs/performance.md
        evidence_artifacts:
          - benchmark stdout artifact
          - benchmark gate JSON artifact
  - gate: Phase 3 -> Phase 4
    canonical_source: docs/strategy_model.yaml
    measurable_checks:
      - metric: BER baseline quality
        threshold: <= 0.01 BER on documented baseline profile/seed
        tests_or_checks:
          - PYTHONPATH=src python benchmarks/error_rate.py
          - pytest -q tests/test_acceptance_benchmark_depth_and_parity.py -k error_rate_gate_definition
        docs_links:
          - docs/performance.md
        evidence_artifacts:
          - benchmark stdout artifact
          - benchmark gate JSON artifact
      - metric: Suite category health
        threshold: Green CI across CLI/API, pipeline/simulation, plugins/security categories
        tests_or_checks:
          - pytest -q tests/test_acceptance_plugin_registry_policy_automation.py
        docs_links:
          - docs/development_roadmap.md
        evidence_artifacts:
          - artifacts/acceptance/plugin-registry-policy-runtime.json
  - gate: Phase 4 release gate
    canonical_source: docs/strategy_model.yaml
    measurable_checks:
      - metric: Plugin policy compliance
        threshold: 100% pass on plugin spec/security checks before registry publication
        tests_or_checks:
          - pytest -q tests/test_acceptance_plugin_registry_policy_automation.py -k phase_four_release_gate_readiness_conditions
          - pytest -q tests/test_plugin_supply_chain_policy.py tests/test_plugin_lifecycle_conformance.py tests/test_cli_plugin_registry.py
        docs_links:
          - docs/plugins.md
        evidence_artifacts:
          - artifacts/acceptance/plugin-registry-policy-runtime.json
