  </text>

  <rect x="72" y="480" width="820" height="28" fill="#94a3b8" opacity="0.45" rx="10" />
  <text x="96" y="499" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#0f172a">
