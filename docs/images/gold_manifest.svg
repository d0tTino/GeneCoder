<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">GeneCoder gold preset manifest preview</title>
  <desc id="desc">Stylised depiction of the HTML manifest generated from the gold preset bundle run.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="url(#bg)" stroke="#cbd5f5" stroke-width="2" rx="18" />
  <rect x="36" y="40" width="888" height="460" fill="url(#panel)" stroke="#cbd5f5" stroke-width="2" rx="14" />

  <rect x="36" y="40" width="888" height="72" fill="#0f172a" rx="14" />
  <text x="72" y="87" fill="#f8fafc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="28">
