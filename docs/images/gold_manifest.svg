  </text>

  <rect x="72" y="140" width="260" height="320" fill="#0f172a" opacity="0.9" rx="12" />
  <text x="96" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">
    Encode Summary
  </text>
  <text x="96" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e2e8f0">
