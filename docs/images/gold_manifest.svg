  </text>

  <rect x="360" y="140" width="532" height="140" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" rx="12" />
  <text x="384" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">
    Channel Health
  </text>
  <text x="384" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0f172a">
    Average coverage: 54×   •   Dropout rate: 0.6%   •   Substitutions: 0.11%
  </text>
  <text x="384" y="238" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0f172a">
    Sequencer: InSilicoSeq MiSeq v2 · Seed 2024-06-01 · Phred30 floor enforced
  </text>

  <rect x="360" y="310" width="532" height="150" fill="#fef9c3" stroke="#facc15" stroke-width="2" rx="12" />
  <text x="384" y="346" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#78350f">
    Decode Output
  </text>
  <text x="384" y="378" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#78350f">
