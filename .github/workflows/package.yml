name: Build Packages

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: [self-hosted, ${{ matrix.os }}]
    timeout-minutes: 45
    strategy:
      matrix:
        os: [windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select lock file
        id: lockfile_pkg
        run: |
          echo "file=poetry.lock" >> "$GITHUB_OUTPUT"
      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            ~\AppData\Local\pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile_pkg.outputs.file) }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry pyinstaller
          poetry install --with gui,web --no-interaction --no-root
      - name: Build package
        run: ./scripts/package_desktop.sh ${{ github.ref_name }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: GeneCoder-${{ matrix.os }}
          path: dist/*
