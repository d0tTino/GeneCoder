name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'openai_testing/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'openai_testing/**'

# Ensure only a single workflow run per PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'openai_testing/**'

  check-comments:
    runs-on: self-hosted
    outputs:
      only_comments: ${{ steps.comment_check.outputs.only_comments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect comment-only changes
        id: comment_check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/only_comments_changed.py

  lint:
    needs: [changes, check-comments]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select lock file
      id: lockfile
      shell: bash
      run: |
        if [ "${RUNNER_OS}" = "Windows" ]; then
          file=poetry.lock.win
        else
          file=poetry.lock.linux
        fi
        echo "file=$file" >> "$GITHUB_OUTPUT"
        cp "$file" poetry.lock

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Poetry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pypoetry
          ~\AppData\Local\pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile.outputs.file) }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with gui,web,dev --no-interaction --no-root

    - name: Install example plugins
      run: |
        pip install ./plugins-examples/example_codec ./plugins-examples/example_fec ./plugins-examples/example_simulator

    - name: Verify example plugin registration
      shell: bash
      run: |
        python - <<'PY'
        from genecoder import plugins
        plugins.CODEC_REGISTRY.clear()
        plugins.FEC_REGISTRY.clear()
        plugins.SIMULATOR_REGISTRY.clear()
        plugins.load_plugins()
        assert "example" in plugins.CODEC_REGISTRY, "codec not registered"
        assert "example" in plugins.FEC_REGISTRY, "fec not registered"
        assert "example" in plugins.SIMULATOR_REGISTRY, "simulator not registered"
        PY

    - name: Restore pre-commit cache
      id: precommit-cache
      uses: actions/cache/restore@v3
      with:
        path: |
          ~/.cache/pre-commit
          .ruff_cache
        key: pre-commit-3.11-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          pre-commit-3.11-

    - name: Run pre-commit
      uses: pre-commit/action@v3
      env:
        PRE_COMMIT_HOME: ~/.cache/pre-commit

    - name: Save pre-commit cache
      uses: actions/cache/save@v3
      with:
        path: |
          ~/.cache/pre-commit
          .ruff_cache
        key: pre-commit-3.11-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run mypy
      run: mypy --config-file mypy.ini src --show-error-codes --no-error-summary

  build:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select lock file
      id: lockfile_build
      shell: bash
      run: |
        if [ "${RUNNER_OS}" = "Windows" ]; then
          file=poetry.lock.win
        else
          file=poetry.lock.linux
        fi
        echo "file=$file" >> "$GITHUB_OUTPUT"
        cp "$file" poetry.lock

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Poetry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pypoetry
          ~\AppData\Local\pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile_build.outputs.file) }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with gui,web,dev --no-interaction --no-root


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - uses: actions/cache@v3
      with:
        path: openai_testing/node_modules
        key: node-${{ runner.os }}-${{ hashFiles('openai_testing/package-lock.json') }}

    - name: Install Node dependencies
      run: |
        cd openai_testing
        npm install
        cd ..

    - name: Smoke test CUA server
      run: node -e "console.log('cua smoke')"

    - name: Run unit tests
      env:
        SKIP_PACKAGING_TESTS: "1"
      run: |
        poetry run pytest --cov=src --cov-config=.coveragerc -vv
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml

  docker:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build Docker image
      run: docker build -t genecoder .

    - name: Run tests inside container
      run: docker run --rm -e SKIP_PACKAGING_TESTS=1 genecoder poetry run pytest -q

  devcontainer:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build devcontainer image
      run: docker build -f .devcontainer/Dockerfile -t genecoder-devcontainer .

    - name: Smoke test devcontainer
      run: docker run --rm genecoder-devcontainer genecoder --version
