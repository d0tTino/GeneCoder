name: Python CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'mypy.ini'
      - 'ruff.toml'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'configs/**'
      - 'benchmarks/**'
      - 'docs/mvp_checklist.md'
      - 'docs/strategy_model.yaml'
      - 'docs/capabilities.yaml'
      - 'docs/vision.md'
      - 'docs/capability_maturity_badges.md'

  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'mypy.ini'
      - 'ruff.toml'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'configs/**'
      - 'benchmarks/**'
      - 'docs/mvp_checklist.md'
      - 'docs/product_strategy.md'
      - 'docs/development_roadmap.md'
      - 'docs/roadmap_execution.md'
      - 'docs/cloud.md'
      - 'docs/cloud_worker.md'
      - 'docs/strategy_model.yaml'
      - 'docs/capabilities.yaml'
      - 'docs/vision.md'
      - 'docs/capability_maturity_badges.md'

# Ensure only a single workflow run per PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      src: ${{ steps.filter.outputs.src }}
      mvp_checklist: ${{ steps.filter.outputs.mvp_checklist }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'mypy.ini'
              - 'ruff.toml'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'benchmarks/**'
            mvp_checklist:
              - 'configs/**'
              - 'docs/mvp_checklist.md'
              - 'scripts/validate_mvp_checklist.py'

  check-comments:
    runs-on: self-hosted
    outputs:
      only_comments: ${{ steps.comment_check.outputs.only_comments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect comment-only changes
        id: comment_check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/only_comments_changed.py

  secret-scan:
    needs: [changes, check-comments]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true

  lint:
    needs: [changes, check-comments]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select lock file
      id: lockfile
      shell: bash
      run: |
        file=poetry.lock
        echo "file=$file" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Poetry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pypoetry
          ~\AppData\Local\pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile.outputs.file) }}

    - name: Install dependencies
      # The test suite relies on the dev group for tools like types-PyYAML
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        if [ "${RUNNER_OS}" = "Windows" ]; then
          poetry.bat install --with gui,web,dev --extras ldpc --no-interaction --no-root
        else
          poetry install --with gui,web,dev --extras ldpc --no-interaction --no-root
        fi

    - name: Install example plugins
      run: |
        pip install ./plugins-examples/example_codec ./plugins-examples/example_fec ./plugins-examples/example_simulator

    - name: Verify example plugin registration
      shell: bash
      run: |
        python - <<'PY'
        from genecoder import plugins
        plugins.CODEC_REGISTRY.clear()
        plugins.FEC_REGISTRY.clear()
        plugins.SIMULATOR_REGISTRY.clear()
        plugins.load_plugins()
        assert "example" in plugins.CODEC_REGISTRY, "codec not registered"
        assert "example" in plugins.FEC_REGISTRY, "fec not registered"
        assert "example" in plugins.SIMULATOR_REGISTRY, "simulator not registered"
        PY

    - name: Run ruff lint
      run: ruff check --exit-non-zero-on-fix .

    - name: Enforce architecture boundaries
      run: pytest -q tests/test_architecture_boundaries.py

    - name: Enforce deprecated import boundaries
      run: pytest -q tests/test_deprecated_import_boundaries.py

    - name: Enforce deprecated reference guardrails
      run: python scripts/check_deprecated_references.py

    - name: Restore pre-commit cache
      id: precommit-cache
      uses: actions/cache/restore@v3
      with:
        path: |
          ~/.cache/pre-commit
          .ruff_cache
        key: pre-commit-3.11-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          pre-commit-3.11-

    - name: Run pre-commit
      uses: pre-commit/action@v3
      env:
        PRE_COMMIT_HOME: ~/.cache/pre-commit

    - name: Save pre-commit cache
      uses: actions/cache/save@v3
      with:
        path: |
          ~/.cache/pre-commit
          .ruff_cache
        key: pre-commit-3.11-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Install package for mypy
      run: pip install -e .[dev]

    - name: Run mypy
      run: mypy --config-file pyproject.toml --show-error-codes --no-error-summary

    - name: Validate benchmark gate alignment
      run: python scripts/check_benchmark_gate_alignment.py

    - name: Regenerate strategy-derived docs
      run: python scripts/generate_strategy_artifacts.py --write

    - name: Fail on generated-doc drift
      run: git diff --exit-code -- docs/capabilities.yaml docs/strategy_validation.json docs/product_strategy.md docs/vision.md docs/development_roadmap.md docs/roadmap_execution.md docs/capability_maturity_badges.md

  glossary:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check glossary terms
      run: python scripts/check_glossary_terms.py


  capability-deterministic-reproducibility:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run deterministic reproducibility capability acceptance gate
      run: pytest -q tests/test_acceptance_deterministic_reproducibility_governance.py

  capability-benchmark-depth-and-parity:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run benchmark depth/parity capability acceptance gate
      run: pytest -q tests/test_acceptance_benchmark_depth_and_parity.py

  capability-plugin-registry-policy:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run plugin policy capability acceptance gate
      run: pytest -q tests/test_acceptance_plugin_registry_policy_automation.py



  capability-completion-evidence:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Generate capability evidence artifacts
      shell: bash
      run: |
        mkdir -p artifacts/acceptance artifacts/benchmarks
        pytest -q tests/test_bundle.py::test_bundle_run tests/test_bundle.py::test_bundle_unknown_section --junitxml artifacts/acceptance/junit-bundle-cli.xml
        pytest -q tests/test_illumina_coverage_quality.py::test_channel_calibrate_writes_expected_artifacts --junitxml artifacts/acceptance/junit-illumina-profile.xml
        pytest -q tests/test_nanopore_context_profile.py::test_calibration_threshold_evaluation_flags_violations tests/test_nanopore_context_profile.py::test_builtin_profile_context_bias --junitxml artifacts/acceptance/junit-nanopore-context.xml
        pytest -q tests/test_acceptance_deterministic_reproducibility_governance.py --junitxml artifacts/acceptance/junit-deterministic-reproducibility.xml
        pytest -q tests/test_acceptance_benchmark_depth_and_parity.py -k "throughput_gate_definition or error_rate_gate_definition" --junitxml artifacts/acceptance/junit-benchmark-depth-and-parity.xml
        pytest -q tests/test_acceptance_plugin_registry_policy_automation.py tests/test_plugin_supply_chain_policy.py tests/test_plugin_lifecycle_conformance.py tests/test_cli_plugin_registry.py --junitxml artifacts/acceptance/junit-plugin-policy.xml
        PYTHONPATH=src python benchmarks/throughput.py --format json > artifacts/benchmarks/throughput.json
        PYTHONPATH=src python benchmarks/error_rate.py --format json > artifacts/benchmarks/error_rate.json

    - name: Validate implemented capability completion criteria
      run: python scripts/validate_capability_completion.py --artifacts-dir artifacts

    - name: Upload capability evidence artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: capability-completion-evidence
        path: |
          artifacts/acceptance/*.xml
          artifacts/benchmarks/*.json
  benchmark-throughput:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run throughput benchmark
      shell: bash
      run: |
        mkdir -p artifacts/benchmarks
        PYTHONPATH=src python benchmarks/throughput.py | tee artifacts/benchmarks/throughput.stdout
        python - <<'PY2'
        import json
        import re
        from pathlib import Path
        text = Path('artifacts/benchmarks/throughput.stdout').read_text(encoding='utf-8')
        match = None
        pattern = re.compile(r'^Base-4\s+encode:\s+([0-9.]+)\s+MB/s\s+decode:\s+([0-9.]+)\s+MB/s$')
        for line in text.splitlines():
            found = pattern.match(line.strip())
            if found:
                match = found
                break
        if match is None:
            raise SystemExit('Unable to parse throughput benchmark output')
        payload = {
            'benchmark': 'throughput',
            'parsed_metrics': {
                'base4_encode_mb_s': float(match.group(1)),
                'base4_decode_mb_s': float(match.group(2)),
            },
            'evidence_artifact': 'artifacts/benchmarks/throughput.stdout',
        }
        Path('artifacts/benchmarks/throughput.kpi.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
        PY2

    - name: Evaluate throughput gate
      shell: bash
      run: |
        python scripts/evaluate_benchmark_gates.py \
          --benchmark throughput \
          --artifact-json artifacts/benchmarks/throughput.kpi.json \
          --output-json artifacts/benchmarks/throughput-gate.json

    - name: Upload throughput benchmark artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-throughput
        path: |
          artifacts/benchmarks/throughput.*
          artifacts/benchmarks/throughput.kpi.json

  benchmark-error-rate:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run BER benchmark
      shell: bash
      run: |
        mkdir -p artifacts/benchmarks
        PYTHONPATH=src python benchmarks/error_rate.py | tee artifacts/benchmarks/error_rate.stdout
        python - <<'PY2'
        import json
        import re
        from pathlib import Path
        text = Path('artifacts/benchmarks/error_rate.stdout').read_text(encoding='utf-8')
        match = None
        pattern = re.compile(r'^encode:\s+([0-9.]+)\s+MB/s\s+decode:\s+([0-9.]+)\s+MB/s\s+BER:\s+([0-9.]+)$')
        for line in text.splitlines():
            found = pattern.match(line.strip())
            if found:
                match = found
                break
        if match is None:
            raise SystemExit('Unable to parse error-rate benchmark output')
        payload = {
            'benchmark': 'error_rate',
            'parsed_metrics': {
                'encode_mb_s': float(match.group(1)),
                'decode_mb_s': float(match.group(2)),
                'ber': float(match.group(3)),
            },
            'evidence_artifact': 'artifacts/benchmarks/error_rate.stdout',
        }
        Path('artifacts/benchmarks/error_rate.kpi.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
        PY2

    - name: Evaluate BER gate
      shell: bash
      run: |
        python scripts/evaluate_benchmark_gates.py \
          --benchmark error_rate \
          --artifact-json artifacts/benchmarks/error_rate.kpi.json \
          --output-json artifacts/benchmarks/error_rate-gate.json

    - name: Upload BER benchmark artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-error-rate
        path: |
          artifacts/benchmarks/error_rate.*
          artifacts/benchmarks/error_rate.kpi.json

  benchmark-gates-from-artifacts:
    needs: [benchmark-throughput, benchmark-error-rate]
    if: always()
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download throughput artifacts
      uses: actions/download-artifact@v4
      with:
        name: benchmark-throughput
        path: artifacts/benchmarks

    - name: Download BER artifacts
      uses: actions/download-artifact@v4
      with:
        name: benchmark-error-rate
        path: artifacts/benchmarks

    - name: Evaluate gates from run-scoped KPI artifacts
      shell: bash
      run: |
        python scripts/evaluate_benchmark_gates.py \
          --benchmark throughput \
          --artifact-json artifacts/benchmarks/throughput.kpi.json \
          --output-json artifacts/benchmarks/throughput-gate-from-artifact.json
        python scripts/evaluate_benchmark_gates.py \
          --benchmark error_rate \
          --artifact-json artifacts/benchmarks/error_rate.kpi.json \
          --output-json artifacts/benchmarks/error_rate-gate-from-artifact.json

    - name: Upload artifact-based gate reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-gates-from-artifacts
        path: artifacts/benchmarks/*-gate-from-artifact.json

  benchmark-competitor-report:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate competitor matrix and fixture-backed report generation
      run: |
        pytest -q tests/test_competitor_report.py
        python scripts/generate_competitor_report.py \
          --matrix benchmarks/competitor_matrix.yaml \
          --results-root artifacts/benchmarks \
          --output artifacts/benchmarks/competitor_report.md \
          --chart artifacts/benchmarks/competitor_report.svg

    - name: Upload competitor report artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-competitor-report
        path: |
          artifacts/benchmarks/competitor_report.md
          artifacts/benchmarks/competitor_report.svg

  mvp-checklist:
    needs: [changes, check-comments]
    if: needs.changes.outputs.mvp_checklist == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate MVP checklist
      run: python scripts/validate_mvp_checklist.py

  build:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select lock file
      id: lockfile_build
      shell: bash
      run: |
        file=poetry.lock
        echo "file=$file" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Poetry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pypoetry
          ~\AppData\Local\pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile_build.outputs.file) }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with gui,web,dev --extras ldpc --no-interaction --no-root

    - name: Run ruff
      run: ruff check .

    - name: Install package for mypy
      run: pip install -e .[dev]

    - name: Run mypy
      run: mypy --config-file pyproject.toml --show-error-codes --no-error-summary

    - name: Validate benchmark gate alignment
      run: python scripts/check_benchmark_gate_alignment.py


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node dependencies
      run: |
        npm install --prefix web/helix-ui
        npm run build --prefix web/helix-ui


    - name: Smoke test GeneCoder GUI
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if command -v timeout >/dev/null 2>&1; then
          timeout 20 python -m genecoder.flet_app || true
        elif command -v gtimeout >/dev/null 2>&1; then
          gtimeout 20 python -m genecoder.flet_app || true
        else
          python -m genecoder.flet_app &
          PID=$!
          sleep 20
          kill $PID || true
        fi

    - name: Smoke test GeneCoder web server
      shell: bash
      run: |
        if command -v timeout >/dev/null 2>&1; then
          timeout 20 poetry run uvicorn web.main:app --port 8000 &
        elif command -v gtimeout >/dev/null 2>&1; then
          gtimeout 20 poetry run uvicorn web.main:app --port 8000 &
        else
          poetry run uvicorn web.main:app --port 8000 &
        fi
        SERVER_PID=$!
        sleep 5
        kill $SERVER_PID

    - name: Run unit tests
      env:
        SKIP_PACKAGING_TESTS: "1"
        STREAMLIT_SERVER_HEADLESS: "1"
      run: |
        poetry run pytest -n auto --cov=src --cov-config=.coveragerc -vv
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml


  docker:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build Docker image
      run: docker build -t genecoder .

    - name: Run tests inside container
      run: docker run --rm -e SKIP_PACKAGING_TESTS=1 genecoder poetry run pytest -n auto -q

  devcontainer:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build devcontainer image
      run: docker build -f .devcontainer/Dockerfile -t genecoder-devcontainer .

    - name: Smoke test devcontainer
      run: docker run --rm genecoder-devcontainer genecoder --version

  sbom:
    needs: [changes, check-comments, build]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SBOM and license tools
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom pip-licenses

      - name: Generate SBOM
        run: cyclonedx-py -o sbom.xml

      - name: Check dependency licenses
        run: pip-licenses --format=csv --fail-on "UNKNOWN" > licenses.csv

      - name: Upload SBOM and license artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.xml
            licenses.csv

  bundle-integration:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select lock file
        id: lockfile_bundle
        shell: bash
        run: |
          file=poetry.lock
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            ~\AppData\Local\pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile_bundle.outputs.file) }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --no-interaction --no-root

      - name: Run bundle integration tests
        env:
          GENECODER_SIM_SEED: "5"
        run: |
          poetry run pytest -vv tests/test_bundle_cli_integration.py

  test-tier-matrix:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [core, integration]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core test dependencies
        if: matrix.tier == 'core'
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-xdist pytest-cov

      - name: Run core test tier
        if: matrix.tier == 'core'
        run: |
          pytest -m core --test-tier=core --junitxml=artifacts/core-junit.xml -q
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          xml_path = Path('artifacts/core-junit.xml')
          root = ET.parse(xml_path).getroot()
          skipped = int(root.attrib.get('skipped', '0'))
          if skipped != 0:
              raise SystemExit(f'core tier cannot skip tests; observed {skipped} skipped tests')
          print('core tier skip check passed (0 skipped tests)')
          PY

      - name: Install integration dependencies
        if: matrix.tier == 'integration'
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with gui,web,dev --extras ldpc --extras fountain --extras bch --extras raptorq --extras deepdna --extras chamaeleo --no-interaction --no-root

      - name: Generate optional integration dependency report
        if: matrix.tier == 'integration'
        run: |
          python scripts/report_optional_test_dependencies.py

      - name: Run optional integration test tier
        if: matrix.tier == 'integration'
        run: |
          poetry run pytest -m integration_optional --test-tier=integration -rs -q

      - name: Upload integration dependency report
        if: matrix.tier == 'integration' && always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-integration-dependency-report
          path: |
            artifacts/optional-integration-dependency-report.md
            artifacts/optional-integration-dependency-report.json


  validated-commit-stamp:
    needs:
      - changes
      - check-comments
      - lint
      - glossary
      - capability-deterministic-reproducibility
      - capability-benchmark-depth-and-parity
      - capability-plugin-registry-policy
      - capability-completion-evidence
      - benchmark-throughput
      - benchmark-error-rate
      - benchmark-gates-from-artifacts
      - build
      - docker
      - devcontainer
      - sbom
      - bundle-integration
      - test-tier-matrix
    if: github.event_name == 'push' && github.ref_protected == true
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify stamped docs match HEAD
        run: python scripts/stamp_validated_commits.py
