name: Python CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'mypy.ini'
      - 'ruff.toml'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'configs/**'
      - 'docs/mvp_checklist.md'

# Ensure only a single workflow run per PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      src: ${{ steps.filter.outputs.src }}
      mvp_checklist: ${{ steps.filter.outputs.mvp_checklist }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'mypy.ini'
              - 'ruff.toml'
              - '.github/workflows/**'
              - 'scripts/**'
            mvp_checklist:
              - 'configs/**'
              - 'docs/mvp_checklist.md'
              - 'scripts/validate_mvp_checklist.py'

  check-comments:
    runs-on: self-hosted
    outputs:
      only_comments: ${{ steps.comment_check.outputs.only_comments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect comment-only changes
        id: comment_check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/only_comments_changed.py

  secret-scan:
    needs: [changes, check-comments]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true

  lint:
    needs: [changes, check-comments]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select lock file
      id: lockfile
      shell: bash
      run: |
        file=poetry.lock
        echo "file=$file" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Poetry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pypoetry
          ~\AppData\Local\pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile.outputs.file) }}

    - name: Install dependencies
      # The test suite relies on the dev group for tools like types-PyYAML
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        if [ "${RUNNER_OS}" = "Windows" ]; then
          poetry.bat install --with gui,web,dev --extras ldpc --no-interaction --no-root
        else
          poetry install --with gui,web,dev --extras ldpc --no-interaction --no-root
        fi

    - name: Install example plugins
      run: |
        pip install ./plugins-examples/example_codec ./plugins-examples/example_fec ./plugins-examples/example_simulator

    - name: Verify example plugin registration
      shell: bash
      run: |
        python - <<'PY'
        from genecoder import plugins
        plugins.CODEC_REGISTRY.clear()
        plugins.FEC_REGISTRY.clear()
        plugins.SIMULATOR_REGISTRY.clear()
        plugins.load_plugins()
        assert "example" in plugins.CODEC_REGISTRY, "codec not registered"
        assert "example" in plugins.FEC_REGISTRY, "fec not registered"
        assert "example" in plugins.SIMULATOR_REGISTRY, "simulator not registered"
        PY

    - name: Run ruff lint
      run: ruff check --exit-non-zero-on-fix .

    - name: Enforce architecture boundaries
      run: pytest -q tests/test_architecture_boundaries.py

    - name: Enforce deprecated import boundaries
      run: pytest -q tests/test_deprecated_import_boundaries.py

    - name: Restore pre-commit cache
      id: precommit-cache
      uses: actions/cache/restore@v3
      with:
        path: |
          ~/.cache/pre-commit
          .ruff_cache
        key: pre-commit-3.11-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          pre-commit-3.11-

    - name: Run pre-commit
      uses: pre-commit/action@v3
      env:
        PRE_COMMIT_HOME: ~/.cache/pre-commit

    - name: Save pre-commit cache
      uses: actions/cache/save@v3
      with:
        path: |
          ~/.cache/pre-commit
          .ruff_cache
        key: pre-commit-3.11-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Install package for mypy
      run: pip install -e .[dev]

    - name: Run mypy
      run: mypy --config-file pyproject.toml --show-error-codes --no-error-summary

  glossary:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check glossary terms
      run: python scripts/check_glossary_terms.py

  mvp-checklist:
    needs: [changes, check-comments]
    if: needs.changes.outputs.mvp_checklist == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate MVP checklist
      run: python scripts/validate_mvp_checklist.py

  build:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select lock file
      id: lockfile_build
      shell: bash
      run: |
        file=poetry.lock
        echo "file=$file" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Poetry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pypoetry
          ~\AppData\Local\pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile_build.outputs.file) }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with gui,web,dev --extras ldpc --no-interaction --no-root

    - name: Run ruff
      run: ruff check .

    - name: Install package for mypy
      run: pip install -e .[dev]

    - name: Run mypy
      run: mypy --config-file pyproject.toml --show-error-codes --no-error-summary


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node dependencies
      run: |
        npm install --prefix web/helix-ui
        npm run build --prefix web/helix-ui


    - name: Smoke test GeneCoder GUI
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if command -v timeout >/dev/null 2>&1; then
          timeout 20 python -m genecoder.flet_app || true
        elif command -v gtimeout >/dev/null 2>&1; then
          gtimeout 20 python -m genecoder.flet_app || true
        else
          python -m genecoder.flet_app &
          PID=$!
          sleep 20
          kill $PID || true
        fi

    - name: Smoke test GeneCoder web server
      shell: bash
      run: |
        if command -v timeout >/dev/null 2>&1; then
          timeout 20 poetry run uvicorn web.main:app --port 8000 &
        elif command -v gtimeout >/dev/null 2>&1; then
          gtimeout 20 poetry run uvicorn web.main:app --port 8000 &
        else
          poetry run uvicorn web.main:app --port 8000 &
        fi
        SERVER_PID=$!
        sleep 5
        kill $SERVER_PID

    - name: Run unit tests
      env:
        SKIP_PACKAGING_TESTS: "1"
        STREAMLIT_SERVER_HEADLESS: "1"
      run: |
        poetry run pytest -n auto --cov=src --cov-config=.coveragerc -vv
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml


  docker:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build Docker image
      run: docker build -t genecoder .

    - name: Run tests inside container
      run: docker run --rm -e SKIP_PACKAGING_TESTS=1 genecoder poetry run pytest -n auto -q

  devcontainer:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build devcontainer image
      run: docker build -f .devcontainer/Dockerfile -t genecoder-devcontainer .

    - name: Smoke test devcontainer
      run: docker run --rm genecoder-devcontainer genecoder --version

  sbom:
    needs: [changes, check-comments, build]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SBOM and license tools
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom pip-licenses

      - name: Generate SBOM
        run: cyclonedx-py -o sbom.xml

      - name: Check dependency licenses
        run: pip-licenses --format=csv --fail-on "UNKNOWN" > licenses.csv

      - name: Upload SBOM and license artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.xml
            licenses.csv

  bundle-integration:
    needs: [changes, check-comments, lint]
    if: needs.changes.outputs.src == 'true' && needs['check-comments'].outputs.only_comments != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select lock file
        id: lockfile_bundle
        shell: bash
        run: |
          file=poetry.lock
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            ~\AppData\Local\pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles(steps.lockfile_bundle.outputs.file) }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --no-interaction --no-root

      - name: Run bundle integration tests
        env:
          GENECODER_SIM_SEED: "5"
        run: |
          poetry run pytest -vv tests/test_bundle_cli_integration.py
