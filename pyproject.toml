
[tool.ruff]
line-length = 88

  [tool.ruff.lint]
  extend-select = []
  extend-ignore = ["E402"]


[tool.poetry]
name = "GeneCoder"
version = "0.1.0"
description = "Simulated DNA data encoding & decoding toolkit"
authors = ["GeneCoder Team"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/d0tTino/GeneCoder"
repository = "https://github.com/d0tTino/GeneCoder"
keywords = ["DNA", "storage", "encoding", "simulation"]
packages = [
    { include = "genecoder", from = "src" },
    { include = "plugins", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
reedsolo = "*"
cryptography = "^45.0.4"
numpy = {version = ">=2.2,<2.3", optional = true}
pyldpc = {version = ">=0.7,<0.8", optional = true}
pyfinite = {version = ">=1.9,<2.0", optional = true}
bchlib = {version = ">=2.1,<3.0", optional = true}
raptorq = {version = ">=2.0,<3.0", optional = true}
flet = {version = ">=0.28,<0.29", optional = true}
matplotlib = {version = "*", optional = true}
flet-webview = {version = "*", optional = true}
fastapi = {version = ">=0.110", optional = true}
uvicorn = { version = "*", extras = ["standard"], optional = true }
httpx = {version = "<0.28", optional = true}

[tool.poetry.group.gui.dependencies]
flet = ">=0.28,<0.29"
matplotlib = "*"
flet-webview = "*"

[tool.poetry.group.web.dependencies]
fastapi = ">=0.110"
uvicorn = { version = "*", extras = ["standard"] }
httpx = "<0.28"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pre-commit = "*"
ruff = "*"
mypy = "*"
hypothesis = "*"

[tool.poetry.scripts]
genecoder = "genecoder.cli.cli:main"

[tool.poetry.plugins."genecoder.plugins"]
reverse = "plugins.reverse_codec"

[tool.poetry.plugins."genecoder.fec"]
reed_solomon = "genecoder.reed_solomon_codec"
ldpc = "genecoder.ldpc_codec"
fountain = "genecoder.fountain_codec"
bch = "genecoder.bch_codec"
raptorq = "genecoder.raptorq_codec"
framed = "genecoder.fec.framed"
dnaformer = "genecoder.dnaformer_codec"

[tool.poetry.plugins."genecoder.simulators"]
nanopore = "genecoder.nanopore_sim"
d2sim = "genecoder.d2sim_adapter"
dnarsim = "genecoder.dnarsim_adapter"
squigulator = "genecoder.squigulator_adapter"
simple = "genecoder.channel_sim"
indel = "genecoder.error_simulation"
illumina = "genecoder.simulators.illumina"
adv_nanopore = "genecoder.simulators.adv_nanopore"

[tool.poetry.extras]
dnaformer = ["dnaformer", "torch"]
framed = ["FrameD"]
ldpc = ["pyldpc", "numpy"]
fountain = ["pyfinite"]
raptorq = ["raptorq", "numpy"]
bch = ["bchlib"]

gui = ["flet", "matplotlib", "flet-webview"]
web = ["fastapi", "uvicorn", "httpx"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flet]
product = "GeneCoder"
app.module = "genecoder.flet_app"
app.path = "src"
