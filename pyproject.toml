
[tool.ruff]
line-length = 88

  [tool.ruff.lint]
  extend-select = []
  extend-ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
explicit_package_bases = true
show_error_codes = true
enable_error_code = "ignore-without-code"
install_types = true
non_interactive = true
files = [
    "src",
    "plugins-examples/example_codec/example_codec",
    "plugins-examples/example_fec/example_fec",
    "plugins-examples/example_simulator/example_simulator",
    "plugins-examples/example_visualizer/example_visualizer",
    "plugins-examples/example_package_plugin/example_plugin",
    "plugins-examples/advanced_fec/advanced_fec",
    "plugins-examples/channel_template/channel_template",
    "plugins-examples/encoder_template/encoder_template",
]
exclude = "^tests/"


[tool.poetry]
name = "GeneCoder"
version = "0.1.0"
description = "Simulated DNA data encoding & decoding toolkit"
authors = ["GeneCoder Team"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/d0tTino/GeneCoder"
repository = "https://github.com/d0tTino/GeneCoder"
keywords = ["DNA", "storage", "encoding", "simulation"]
packages = [
    { include = "genecoder", from = "src" },
    { include = "plugins", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
reedsolo = "*"
cryptography = "^45.0.4"
pyyaml = "*"
portalocker = "*"
numpy = {version = ">=2.2,<2.3", optional = true}
numba = "*"
pyldpc = {version = ">=0.7.6,<0.7.7", optional = true}
pyfinite = {version = ">=1.9,<2.0", optional = true}
bchlib = {version = ">=2.1,<3.0", optional = true}
raptorq = {version = ">=2.0,<3.0", optional = true}
httpx = "<0.28"
jsonschema = ">=4.0"
deepdna = {version = "*", optional = true}
chamaeleo = {version = "*", optional = true}
dnachisel = {version = "*", optional = true}

[tool.poetry.group.gui.dependencies]
flet = ">=0.28,<0.29"
matplotlib = "*"
flet-webview = "*"
streamlit = "*"

[tool.poetry.group.web.dependencies]
fastapi = ">=0.110"
uvicorn = { version = "*", extras = ["standard"] }
fastapi-limiter = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pre-commit = "*"
ruff = "*"
mypy = "*"
types-PyYAML = "*"
pyldpc = ">=0.7.6,<0.7.7"
pyfinite = ">=1.9,<2.0"
bchlib = ">=2.1,<3.0"
raptorq = ">=2.0,<3.0"
numba = "*"
playwright = "*"

[tool.poetry.scripts]
genecli = "genecoder.cli.cli:main"

[tool.poetry.plugins."genecoder.plugins"]
reverse = "plugins.reverse_codec"

[tool.poetry.plugins."genecoder.fec"]
reed_solomon = "genecoder.reed_solomon_codec"
ldpc = "genecoder.ldpc_codec"
fountain = "genecoder.fountain_codec"
bch = "genecoder.bch_codec"
raptorq = "genecoder.raptorq_codec"
dnaformer = "genecoder.dnaformer_codec"
deepdna = "genecoder.deepdna_codec"

[tool.poetry.plugins."genecoder.simulators"]
nanopore = "genecoder.simulators.nanopore"
d2sim = "genecoder.d2sim_adapter"
dnarsim = "genecoder.dnarsim_adapter"
squigulator = "genecoder.squigulator_adapter"
simple = "genecoder.error_simulation"
indel = "genecoder.error_simulation"
illumina = "genecoder.simulators.illumina"

[tool.poetry.extras]
dnaformer = ["dnaformer", "torch"]
ldpc = ["pyldpc", "numpy"]
fountain = ["pyfinite"]
raptorq = ["raptorq", "numpy"]
bch = ["bchlib"]
deepdna = ["deepdna", "torch"]
chamaeleo = ["chamaeleo"]
chisel = ["dnachisel"]
dev = ["types-PyYAML"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flet]
product = "GeneCoder"
app.module = "genecoder.flet_app"
app.path = "src"
